<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>عالم مراسي - تسجيل الحسابات والمسافرين</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <style>

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                'Tajawal',
                sans-serif;

        }


        body {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content:
                space-between;

            align-items: center;

            background-color:
                #0f051d;

            overflow-x: hidden;

            position: relative;

        }


        /* =====================================================
           الخلفيات
        ===================================================== */

        .blur-circle-1 {

            position: absolute;

            width: 500px;
            height: 500px;

            background: #5b21b6;

            border-radius: 50%;

            filter:
                blur(150px);

            top: 5%;
            left: 5%;

            opacity: 0.5;

            z-index: 1;

        }


        .blur-circle-2 {

            position: absolute;

            width: 450px;
            height: 450px;

            background: #7c3aed;

            border-radius: 50%;

            filter:
                blur(160px);

            bottom: 5%;
            right: 5%;

            opacity: 0.4;

            z-index: 1;

        }


        /* =====================================================
           الشريط العلوي
        ===================================================== */

        .header-nav {

            margin-top: 25px;

            z-index: 10;

            background:
                rgba(255,255,255,0.08);

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            border:
                1px solid
                rgba(255,255,255,0.25);

            padding:
                16px 35px;

            border-radius:
                60px;

            display:
                flex;

            gap: 15px;

            align-items:
                center;

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.4);

            max-width: 95%;

            width: 1050px;

            justify-content:
                space-around;

            flex-wrap:
                wrap;

        }


        .nav-btn {

            color:
                #ffffff;

            text-decoration:
                none;

            padding:
                12px 24px;

            border-radius:
                50px;

            font-weight:
                700;

            font-size:
                1.05rem;

            transition:
                all 0.3s ease;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.15);

            cursor:
                pointer;

        }


        .nav-btn:hover {

            background:
                rgba(124,58,237,0.4);

            border-color:
                rgba(192,132,252,0.6);

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 20px
                rgba(124,58,237,0.4);

        }


        /* =====================================================
           الكارت الرئيسي
        ===================================================== */

        .main-card {

            position:
                relative;

            z-index:
                10;

            padding:
                3rem;

            background:
                rgba(255,255,255,0.06);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border:
                1px solid
                rgba(255,255,255,0.25);

            border-radius:
                40px;

            box-shadow:
                0 25px 50px
                rgba(0,0,0,0.5);

            max-width:
                95%;

            width:
                850px;

            margin:
                30px 0;

        }


        .title {

            color:
                #ffffff;

            font-size:
                2.2rem;

            font-weight:
                900;

            margin-bottom:
                2rem;

            text-align:
                center;

            text-shadow:
                0 4px 25px
                rgba(124,58,237,0.7);

        }


        /* =====================================================
           النموذج
        ===================================================== */

        .form-grid {

            display:
                grid;

            grid-template-columns:
                repeat(2,1fr);

            gap:
                20px;

        }


        .form-group {

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

        }


        .form-group.full-width {

            grid-column:
                span 2;

        }


        .form-group label {

            color:
                #e2e8f0;

            font-weight:
                700;

            font-size:
                0.95rem;

            padding-right:
                5px;

        }


        .form-group label
        span.required {

            color:
                #f87171;

        }


        .form-group label
        span.optional {

            color:
                #94a3b8;

            font-size:
                0.8rem;

        }


        .bubble-input {

            width:
                100%;

            padding:
                1.17rem 1.56rem;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid
                rgba(255,255,255,0.18);

            border-radius:
                25px;

            color:
                #ffffff;

            font-size:
                1.23rem;

            font-weight:
                700;

            outline:
                none;

            transition:
                all 0.3s ease;

        }


        .bubble-input::placeholder {

            color:
                #64748b;

        }


        .bubble-input:hover,
        .bubble-input:focus {

            background:
                rgba(255,255,255,0.1);

            border-color:
                rgba(167,139,250,0.7);

            box-shadow:
                0 0 20px
                rgba(167,139,250,0.4);

            transform:
                translateY(-2px);

        }


        input[type="date"]
        ::-webkit-calendar-picker-indicator {

            filter:
                invert(1);

            cursor:
                pointer;

        }


        /* =====================================================
           زر الحفظ
        ===================================================== */

        .submit-btn {

            grid-column:
                span 2;

            margin-top:
                15px;

            padding:
                1.1rem;

            font-size:
                1.2rem;

            font-weight:
                700;

            color:
                #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4c1d95
                );

            border:
                none;

            border-radius:
                30px;

            cursor:
                pointer;

            transition:
                all 0.3s ease;

            box-shadow:
                0 6px 20px
                rgba(124,58,237,0.5);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                10px;

        }


        .submit-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(124,58,237,0.8);

        }


        .submit-btn:disabled {

            opacity:
                0.7;

            cursor:
                not-allowed;

            transform:
                none;

        }


        /* =====================================================
           Spinner
        ===================================================== */

        .loading-spinner {

            width:
                22px;

            height:
                22px;

            border:
                3px solid
                rgba(255,255,255,0.3);

            border-top-color:
                #ffffff;

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =====================================================
           نافذة البحث
        ===================================================== */

        .search-overlay {

            position:
                fixed;

            inset:
                0;

            background:
                rgba(5,2,12,0.75);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            z-index:
                9999;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

        }


        .search-overlay.active {

            display:
                flex;

        }


        .search-modal {

            width:
                100%;

            max-width:
                650px;

            max-height:
                85vh;

            overflow-y:
                auto;

            background:
                rgba(25,10,45,0.96);

            border:
                1px solid
                rgba(255,255,255,0.25);

            border-radius:
                30px;

            padding:
                25px;

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.7);

            animation:
                modalIn 0.25s ease;

        }


        @keyframes modalIn {

            from {

                opacity:
                    0;

                transform:
                    translateY(20px)
                    scale(0.97);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .search-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin-bottom:
                20px;

        }


        .search-title {

            color:
                #ffffff;

            font-size:
                1.6rem;

            font-weight:
                900;

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .search-title i {

            color:
                #c084fc;

        }


        .close-search {

            width:
                42px;

            height:
                42px;

            border:
                none;

            border-radius:
                50%;

            background:
                rgba(255,255,255,0.08);

            color:
                #ffffff;

            cursor:
                pointer;

            font-size:
                1.1rem;

            transition:
                0.3s;

        }


        .close-search:hover {

            background:
                rgba(239,68,68,0.5);

            transform:
                rotate(90deg);

        }


        .search-box {

            display:
                flex;

            gap:
                10px;

        }


        .search-input {

            flex:
                1;

            min-width:
                0;

            padding:
                15px 18px;

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius:
                20px;

            background:
                rgba(255,255,255,0.06);

            color:
                #ffffff;

            outline:
                none;

            font-size:
                1.05rem;

            font-weight:
                700;

        }


        .search-input:focus {

            border-color:
                #a78bfa;

            box-shadow:
                0 0 18px
                rgba(167,139,250,0.3);

        }


        .search-action {

            padding:
                0 22px;

            border:
                none;

            border-radius:
                20px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4c1d95
                );

            color:
                #ffffff;

            font-weight:
                800;

            cursor:
                pointer;

            font-size:
                1rem;

        }


        .search-action:disabled {

            opacity:
                0.7;

            cursor:
                not-allowed;

        }


        .search-status {

            text-align:
                center;

            color:
                #cbd5e1;

            padding:
                20px 5px 5px;

            min-height:
                25px;

        }


        /* =====================================================
           نتائج البحث
        ===================================================== */

        .search-results {

            margin-top:
                15px;

            display:
                flex;

            flex-direction:
                column;

            gap:
                10px;

        }


        .result-item {

            width:
                100%;

            border:
                1px solid
                rgba(255,255,255,0.14);

            background:
                rgba(255,255,255,0.05);

            border-radius:
                20px;

            padding:
                15px;

            color:
                #ffffff;

            cursor:
                pointer;

            transition:
                all 0.25s ease;

            text-align:
                right;

        }


        .result-item:hover {

            background:
                rgba(124,58,237,0.25);

            border-color:
                rgba(192,132,252,0.6);

            transform:
                translateY(-2px);

        }


        .result-name {

            font-size:
                1.1rem;

            font-weight:
                900;

            margin-bottom:
                6px;

        }


        .result-info {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                12px;

            color:
                #cbd5e1;

            font-size:
                0.9rem;

        }


        .result-info span {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

        }


        .result-info i {

            color:
                #a78bfa;

        }


        /* =====================================================
           Footer
        ===================================================== */

        .footer {

            width:
                100%;

            z-index:
                10;

            background:
                rgba(255,255,255,0.02);

            backdrop-filter:
                blur(10px);

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            padding:
                20px 0;

        }


        .footer-container {

            max-width:
                1200px;

            margin:
                0 auto;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            flex-wrap:
                wrap;

            padding:
                0 20px;

            gap:
                15px;

            color:
                #cbd5e1;

            font-size:
                0.9rem;

        }


        .footer a {

            color:
                #a78bfa;

            text-decoration:
                none;

        }


        .designer-name {

            font-weight:
                700;

            color:
                #c084fc;

        }


        /* =====================================================
           الهاتف
        ===================================================== */

        @media (max-width:768px) {

            .header-nav {

                width:
                    95%;

                padding:
                    12px;

                border-radius:
                    30px;

            }


            .nav-btn {

                font-size:
                    0.9rem;

                padding:
                    10px 14px;

            }


            .form-grid {

                grid-template-columns:
                    1fr;

            }


            .form-group.full-width,
            .submit-btn {

                grid-column:
                    span 1;

            }


            .main-card {

                padding:
                    2rem 1.5rem;

            }


            .search-box {

                flex-direction:
                    column;

            }


            .search-action {

                padding:
                    14px;

            }


            .footer-container {

                flex-direction:
                    column;

                text-align:
                    center;

            }

        }

    </style>

</head>


<body>

    <!-- =====================================================
         الكارت الرئيسي
    ====================================================== -->

    <main class="main-card">


        <h1 class="title">

            إدخال بيانات المسافر والحسابات

        </h1>


        <form
            id="dataForm"
            onsubmit="exportToGoogleSheets(event)"
            class="form-grid">


            <!-- اسم المسافر -->

            <div class="form-group">

                <label>

                    اسم المسافر

                    <span class="required">*</span>

                </label>


                <input
                    type="text"
                    id="passengerName"
                    class="bubble-input"
                    placeholder="أدخل اسم المسافر بالكامل"
                    required>

            </div>


            <!-- رقم الحجز -->

            <div class="form-group">

                <label>

                    رقم الحجز

                    <span class="required">*</span>

                </label>


                <input
                    type="text"
                    id="bookingNumber"
                    class="bubble-input"
                    placeholder="أدخل رقم الحجز"
                    required>

            </div>


            <!-- رقم الموبايل -->

            <div class="form-group">

                <label>

                    رقم الموبايل

                    <span class="required">*</span>

                </label>


                <input
                    type="tel"
                    id="mobileNumber"
                    class="bubble-input"
                    placeholder="01xxxxxxxxx"
                    required>

            </div>


            <!-- تاريخ الحجز -->

            <div class="form-group">

                <label>

                    تاريخ الحجز

                    <span class="required">*</span>

                </label>


                <input
                    type="date"
                    id="bookingDate"
                    class="bubble-input"
                    required>

            </div>


            <!-- تاريخ السفر -->

            <div class="form-group">

                <label>

                    تاريخ السفر

                    <span class="required">*</span>

                </label>


                <input
                    type="date"
                    id="travelDate"
                    class="bubble-input"
                    required>

            </div>


            <!-- المبلغ الكلي -->

            <div class="form-group">

                <label>

                    المبلغ الكلي

                    <span class="required">*</span>

                </label>


                <input
                    type="number"
                    id="totalAmount"
                    class="bubble-input"
                    placeholder="0.00"
                    oninput="calculateRemaining()"
                    required>

            </div>


            <!-- المبلغ المدفوع -->

            <div class="form-group">

                <label>

                    المبلغ المدفوع

                    <span class="required">*</span>

                </label>


                <input
                    type="number"
                    id="paidAmount"
                    class="bubble-input"
                    placeholder="0.00"
                    oninput="calculateRemaining()"
                    required>

            </div>


            <!-- المبلغ المتبقي -->

            <div class="form-group">

                <label>

                    المبلغ المتبقي

                    <span class="required">*</span>

                </label>


                <input
                    type="number"
                    id="remainingAmount"
                    class="bubble-input"
                    placeholder="0.00"
                    readonly
                    required>

            </div>


            <!-- العمولة -->

            <div class="form-group">

                <label>

                    العمولة المضافة

                    <span class="required">*</span>

                </label>


                <input
                    type="number"
                    id="commission"
                    class="bubble-input"
                    placeholder="0.00"
                    required>

            </div>


            <!-- الشركة -->

            <div class="form-group full-width">

                <label>

                    تبع شركة

                    <span class="optional">
                        (اختياري)
                    </span>

                </label>


                <input
                    type="text"
                    id="companyName"
                    class="bubble-input"
                    placeholder="أدخل اسم الشركة إن وجد">

            </div>


            <!-- زر الحفظ -->

            <button
                type="submit"
                class="submit-btn">

                <i class="fa-solid fa-cloud-arrow-up"></i>

                حفظ البيانات

            </button>


        </form>


    </main>


    <!-- =====================================================
         نافذة البحث
    ====================================================== -->

    <div
        id="searchOverlay"
        class="search-overlay"
        onclick="closeSearchFromOverlay(event)">


        <div
            class="search-modal"
            onclick="event.stopPropagation()">


            <div class="search-header">


                <div class="search-title">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    البحث عن مسافر

                </div>


                <button
                    type="button"
                    class="close-search"
                    onclick="closeSearch()">

                    <i class="fa-solid fa-xmark"></i>

                </button>


            </div>


            <div class="search-box">


                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="اكتب اسم المسافر أو رقم الحجز..."
                    autocomplete="off">


                <button
                    type="button"
                    id="searchButton"
                    class="search-action"
                    onclick="searchPassenger()">

                    <i class="fa-solid fa-search"></i>

                    بحث

                </button>


            </div>


            <div
                id="searchStatus"
                class="search-status">

                اكتب اسم المسافر أو رقم الحجز للبحث

            </div>


            <div
                id="searchResults"
                class="search-results">

            </div>


        </div>


    </div>

         Footer

        <div class="footer-container">


            <div>

                <i
                    class="fa-solid fa-phone"

                </i>

                التواصل:

                01129713352 |

            </div>


            <div>

                <a
                    href="https://facebook.com"
                    target="_blank">

                    صفحتنا على فيسبوك

                </a>

            </div>


            <div>

                <i
                    class="fa-solid fa-code"
                    style="color:#a78bfa;">
                </i>

                تصميم وتطوير:


                <span class="designer-name">

                    ENG / AHMED ELSHEMEE MAHMOUD

                </span>

    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script>


        // =====================================================
        // رابط Google Apps Script
        // =====================================================

        const GOOGLE_SHEET_URL =
            "https://script.google.com/macros/s/AKfycbyJWg5K_Ld3_tySJUD9RkHm_C8pndvFZWacuEOvjOlt66qr7q0pHY1QTrGfffCNt7W0gA/exec";


        // =====================================================
        // حساب المبلغ المتبقي
        // =====================================================

        function calculateRemaining() {


            const total =
                parseFloat(
                    document.getElementById(
                        "totalAmount"
                    ).value
                ) || 0;


            const paid =
                parseFloat(
                    document.getElementById(
                        "paidAmount"
                    ).value
                ) || 0;


            const remaining =
                total - paid;


            document.getElementById(
                "remainingAmount"
            ).value =
                remaining >= 0
                    ? remaining
                    : 0;

        }


        // =====================================================
        // فتح نافذة البحث
        // =====================================================

        function openSearch() {


            const overlay =
                document.getElementById(
                    "searchOverlay"
                );


            overlay.classList.add(
                "active"
            );


            setTimeout(
                function() {

                    document
                        .getElementById(
                            "searchInput"
                        )
                        .focus();

                },
                150
            );

        }


        // =====================================================
        // إغلاق نافذة البحث
        // =====================================================

        function closeSearch() {


            document
                .getElementById(
                    "searchOverlay"
                )
                .classList.remove(
                    "active"
                );


            document
                .getElementById(
                    "searchInput"
                )
                .value = "";


            document
                .getElementById(
                    "searchResults"
                )
                .innerHTML = "";


            document
                .getElementById(
                    "searchStatus"
                )
                .textContent =
                "اكتب اسم المسافر أو رقم الحجز للبحث";

        }


        // =====================================================
        // إغلاق عند الضغط خارج النافذة
        // =====================================================

        function closeSearchFromOverlay(event) {


            if (
                event.target.id ===
                "searchOverlay"
            ) {

                closeSearch();

            }

        }


        // =====================================================
        // البحث
        // =====================================================

        function searchPassenger() {


            const input =
                document.getElementById(
                    "searchInput"
                );


            const query =
                input.value.trim();


            const status =
                document.getElementById(
                    "searchStatus"
                );


            const resultsContainer =
                document.getElementById(
                    "searchResults"
                );


            const searchButton =
                document.getElementById(
                    "searchButton"
                );


            // =================================================
            // التحقق من البحث
            // =================================================

            if (!query) {

                status.textContent =
                    "⚠️ اكتب اسم المسافر أو رقم الحجز أولاً.";

                resultsContainer.innerHTML =
                    "";

                input.focus();

                return;

            }


            // =================================================
            // حالة التحميل
            // =================================================

            searchButton.disabled =
                true;


            searchButton.innerHTML =
                '<span class="loading-spinner"></span>';


            status.textContent =
                "جاري البحث...";


            resultsContainer.innerHTML =
                "";


            // =================================================
            // اسم Callback
            // =================================================

            const callbackName =
                "searchCallback_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() * 100000
                );


            // =================================================
            // إنشاء الدالة
            // =================================================

            window[callbackName] =
                function(response) {


                    try {

                        if (
                            !response ||
                            !response.success
                        ) {

                            status.textContent =
                                response &&
                                response.message
                                    ? response.message
                                    : "حدث خطأ أثناء البحث.";

                            return;

                        }


                        const results =
                            response.results ||
                            [];


                        // =================================================
                        // لا توجد نتائج
                        // =================================================

                        if (
                            results.length === 0
                        ) {

                            status.textContent =
                                "❌ لم يتم العثور على مسافر بهذا الاسم أو رقم الحجز.";

                            return;

                        }


                        // =================================================
                        // عدد النتائج
                        // =================================================

                        status.textContent =
                            "تم العثور على " +
                            results.length +
                            " نتيجة. اضغط على المسافر لعرض بياناته.";


                        // =================================================
                        // عرض النتائج
                        // =================================================

                        results.forEach(
                            function(item) {

                                const result =
                                    document.createElement(
                                        "button"
                                    );


                                result.type =
                                    "button";


                                result.className =
                                    "result-item";


                                result.innerHTML = `

                                    <div class="result-name">

                                        ${escapeHtml(
                                            item.passengerName
                                        )}

                                    </div>

                                    <div class="result-info">

                                        <span>

                                            <i class="fa-solid fa-ticket"></i>

                                            ${escapeHtml(
                                                item.bookingNumber
                                            )}

                                        </span>

                                        <span>

                                            <i class="fa-solid fa-phone"></i>

                                            ${escapeHtml(
                                                item.mobileNumber
                                            )}

                                        </span>

                                        <span>

                                            <i class="fa-solid fa-plane"></i>

                                            ${escapeHtml(
                                                item.travelDate
                                            )}

                                        </span>

                                    </div>

                                `;


                                result.onclick =
                                    function() {

                                        fillPassengerData(
                                            item
                                        );

                                    };


                                resultsContainer.appendChild(
                                    result
                                );

                            }
                        );


                    } finally {

                        searchButton.disabled =
                            false;


                        searchButton.innerHTML =
                            '<i class="fa-solid fa-search"></i> بحث';


                        delete window[
                            callbackName
                        ];

                    }

                };


            // =================================================
            // إنشاء Script للبحث
            // =================================================

            const script =
                document.createElement(
                    "script"
                );


            const url =
                GOOGLE_SHEET_URL +
                "?action=search" +
                "&query=" +
                encodeURIComponent(
                    query
                ) +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                ) +
                "&_=" +
                Date.now();


            script.src =
                url;


            script.async =
                true;


            // =================================================
            // في حالة الخطأ
            // =================================================

            script.onerror =
                function() {

                    status.textContent =
                        "❌ حدث خطأ أثناء الاتصال بقاعدة البيانات.";

                    searchButton.disabled =
                        false;

                    searchButton.innerHTML =
                        '<i class="fa-solid fa-search"></i> بحث';

                    delete window[
                        callbackName
                    ];

                    script.remove();

                };


            document
                .body
                .appendChild(
                    script
                );


            // =================================================
            // تنظيف Script بعد التحميل
            // =================================================

            script.onload =
                function() {

                    setTimeout(
                        function() {

                            script.remove();

                        },
                        100
                    );

                };

        }


        // =====================================================
        // الضغط Enter للبحث
        // =====================================================

        document
            .getElementById(
                "searchInput"
            )
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        searchPassenger();

                    }

                }
            );


        // =====================================================
        // تعبئة بيانات المسافر
        // =====================================================

        function fillPassengerData(
            data
        ) {


            document.getElementById(
                "passengerName"
            ).value =
                data.passengerName || "";


            document.getElementById(
                "bookingNumber"
            ).value =
                data.bookingNumber || "";


            document.getElementById(
                "mobileNumber"
            ).value =
                data.mobileNumber || "";


            document.getElementById(
                "bookingDate"
            ).value =
                data.bookingDate || "";


            document.getElementById(
                "travelDate"
            ).value =
                data.travelDate || "";


            document.getElementById(
                "totalAmount"
            ).value =
                data.totalAmount || "";


            document.getElementById(
                "paidAmount"
            ).value =
                data.paidAmount || "";


            document.getElementById(
                "remainingAmount"
            ).value =
                data.remainingAmount || "";


            document.getElementById(
                "commission"
            ).value =
                data.commission || "";


            document.getElementById(
                "companyName"
            ).value =
                data.companyName ===
                    "لا يوجد"
                    ? ""
                    : (
                        data.companyName ||
                        ""
                    );


            // =================================================
            // إغلاق نافذة البحث
            // =================================================

            closeSearch();


            // =================================================
            // رسالة داخل العنوان بدون Popup
            // =================================================

            const title =
                document.querySelector(
                    ".title"
                );


            const oldTitle =
                title.innerHTML;


            title.innerHTML =
                '<i class="fa-solid fa-circle-check" style="color:#86efac;"></i> تم تحميل بيانات المسافر';


            setTimeout(
                function() {

                    title.innerHTML =
                        oldTitle;

                },
                2500
            );


            // =================================================
            // حساب المتبقي
            // =================================================

            calculateRemaining();


            // =================================================
            // نقل المستخدم لأول خانة
            // =================================================

            document
                .getElementById(
                    "passengerName"
                )
                .focus();

        }


        // =====================================================
        // حماية عرض النصوص داخل HTML
        // =====================================================

        function escapeHtml(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value === null ||
                value === undefined
                    ? ""
                    : value;


            return div.innerHTML;

        }


        // =====================================================
        // حفظ البيانات في Google Sheets
        // بدون تنزيل Excel
        // وبدون Popup
        // =====================================================

        async function exportToGoogleSheets(
            e
        ) {

            e.preventDefault();


            const form =
                document.getElementById(
                    "dataForm"
                );


            const submitButton =
                document.querySelector(
                    ".submit-btn"
                );


            const passengerName =
                document.getElementById(
                    "passengerName"
                ).value.trim();


            const data = {

                passengerName:
                    passengerName,

                bookingNumber:
                    document.getElementById(
                        "bookingNumber"
                    ).value.trim(),

                mobileNumber:
                    document.getElementById(
                        "mobileNumber"
                    ).value.trim(),

                bookingDate:
                    document.getElementById(
                        "bookingDate"
                    ).value,

                travelDate:
                    document.getElementById(
                        "travelDate"
                    ).value,

                totalAmount:
                    parseFloat(
                        document.getElementById(
                            "totalAmount"
                        ).value
                    ) || 0,

                paidAmount:
                    parseFloat(
                        document.getElementById(
                            "paidAmount"
                        ).value
                    ) || 0,

                remainingAmount:
                    parseFloat(
                        document.getElementById(
                            "remainingAmount"
                        ).value
                    ) || 0,

                commission:
                    parseFloat(
                        document.getElementById(
                            "commission"
                        ).value
                    ) || 0,

                companyName:
                    document.getElementById(
                        "companyName"
                    ).value.trim() ||
                    "لا يوجد"

            };


            try {


                // =================================================
                // تحميل
                // =================================================

                submitButton.disabled =
                    true;


                submitButton.innerHTML = `

                    <span class="loading-spinner"></span>

                    جاري حفظ البيانات...

                `;


                // =================================================
                // إرسال Google Sheets
                // =================================================

                await fetch(

                    GOOGLE_SHEET_URL,

                    {

                        method:
                            "POST",

                        mode:
                            "no-cors",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify(
                                data
                            )

                    }

                );


                // =================================================
                // بدون Alert
                // =================================================

                submitButton.innerHTML = `

                    <i
                        class="fa-solid fa-circle-check"
                        style="color:#86efac;">
                    </i>

                    تم الحفظ بنجاح

                `;


                // =================================================
                // تفريغ النموذج
                // =================================================

                form.reset();


                document.getElementById(
                    "remainingAmount"
                ).value = "";


                // =================================================
                // إعادة الزر
                // =================================================

                setTimeout(
                    function() {

                        submitButton.disabled =
                            false;

                        submitButton.innerHTML = `

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            حفظ البيانات

                        `;

                    },
                    1800
                );


            } catch (error) {


                console.error(
                    error
                );


                submitButton.disabled =
                    false;


                submitButton.innerHTML = `

                    <i class="fa-solid fa-cloud-arrow-up"></i>

                    حفظ البيانات

                `;

            }

        }


    </script>


</body>
