<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم مراسي - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: #0f051d;
            overflow-x: hidden;
            position: relative;
        }

        /* دوائر الإضاءة والخلفية */
        .blur-circle-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: #5b21b6;
            border-radius: 50%;
            filter: blur(150px);
            top: -10%;
            left: 10%;
            opacity: 0.6;
            z-index: 1;
        }

        .blur-circle-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: #7c3aed;
            border-radius: 50%;
            filter: blur(160px);
            bottom: 0%;
            right: 10%;
            opacity: 0.5;
            z-index: 1;
        }

        /* الشريط العلوي - تصميم فقاعة الماء الأفقية */
        .header-nav {
            margin-top: 30px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 60px;
            display: flex;
            flex-direction: row;
            gap: 15px;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.4),
                inset 0 10px 20px rgba(255, 255, 255, 0.15);
            max-width: 95%;
            width: auto;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        /* أزرار على شكل فقاعات مائية */
        .nav-btn {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.4s ease;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 4px 8px rgba(255, 255, 255, 0.2);
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(167, 139, 250, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 
                0 10px 20px rgba(124, 58, 237, 0.5),
                inset 0 6px 12px rgba(255, 255, 255, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
            padding: 20px 0;
            gap: 15px;
        }

        /* عنوان "عالم مراسي" المموه والذاتي اللمعان كل 4 ثواني */
        .brand-title {
            position: relative;
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            color: #1e0b36;
            text-shadow: 
                0 0 10px rgba(124, 58, 237, 0.8),
                0 0 25px rgba(91, 33, 182, 0.9),
                0 0 45px rgba(167, 139, 250, 0.6);
            /* تأثير اللمعان أفقياً كل 4 ثواني */
            background: linear-gradient(
                110deg, 
                #18082e 0%, 
                #3b156b 25%, 
                #ffffff 50%, 
                #3b156b 75%, 
                #18082e 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
             background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: moveShine 4s infinite linear;
            backdrop-filter: blur(5px);
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
            user-select: none;
        }

        /* انيميشن اللمعان */
        @keyframes moveShine {
            0% {
                background-position: 200% center;
            }
            100% {
                background-position: -200% center;
            }
        }

        /* كارت تسجيل الدخول */
        .login-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top: 2px solid rgba(255, 255, 255, 0.45);
            border-left: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 45px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                inset 0 15px 30px rgba(255, 255, 255, 0.12),
                inset 0 -15px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.4s ease;
        }

        .login-card:hover {
            box-shadow: 
                0 30px 60px rgba(124, 58, 237, 0.35),
                inset 0 20px 35px rgba(255, 255, 255, 0.25);
        }

        .card-title {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(167, 139, 250, 0.6);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: #e2e8f0;
            font-size: 1.05rem;
            font-weight: 700;
            padding-right: 8px;
        }

        /* الخانات والمدخلات بتصميم فقاعة الماء */
        .bubble-input {
            width: 100%;
            padding: 1rem 1.4rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 
                inset 0 3px 8px rgba(0, 0, 0, 0.3),
                inset 0 -2px 5px rgba(255, 255, 255, 0.1);
        }

        .bubble-input::placeholder {
            color: #94a3b8;
        }

        .bubble-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(192, 132, 252, 0.8);
            box-shadow: 
                0 0 20px rgba(167, 139, 250, 0.5),
                inset 0 4px 10px rgba(255, 255, 255, 0.3);
            transform: scale(1.01);
        }

        /* رسالة الخطأ عند إدخال بيانات خاطئة */
        .error-message {
            color: #ff6b6b;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
            display: none;
            margin-top: -5px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        /* زر الدخول */
        .login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 1.1rem;
            font-size: 1.25rem;
            font-weight: 900;
            color: #ffffff;
            background: linear-gradient(135deg, #8b5cf6, #4c1d95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 8px 25px rgba(124, 58, 237, 0.5),
                inset 0 6px 12px rgba(255, 255, 255, 0.35);
        }

        .login-btn:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 
                0 12px 30px rgba(124, 58, 237, 0.8),
                inset 0 8px 16px rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg, #a78bfa, #5b21b6);
        }

        /* الفوتر */
        .footer {
            width: 100%;
            z-index: 10;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px 0;
            margin-top: auto;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 20px;
            gap: 15px;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .footer a {
            color: #a78bfa;
            text-decoration: none;
        }

        .designer-name {
            font-weight: 700;
            color: #c084fc;
        }

        @media (max-width: 650px) {
            .brand-title {
                font-size: 2.6rem;
            }
            .header-nav {
                overflow-x: auto;
                justify-content: flex-start;
                padding: 10px 15px;
            }
            .footer-container {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="blur-circle-1"></div>
    <div class="blur-circle-2"></div>

    <!-- الشريط العلوي -->
    <nav class="header-nav">
        <button onclick="requireLogin('تسجيل الخروج')" class="nav-btn">تسجيل الخروج</button>
        <button onclick="requireLogin('حجز المسافرين')" class="nav-btn">حجز المسافرين</button>
        <button onclick="requireLogin('معلومات حول')" class="nav-btn">معلومات حول</button>
        <button onclick="requireLogin('الدعم والتواصل')" class="nav-btn">الدعم والتواصل</button>
    </nav>

    <!-- منطقة المنتصف -->
    <main class="main-content">
        <!-- كلمة "عالم مراسي" المموهة واللماعة -->
        <h1 class="brand-title">مرحبا في عالم مراسي</h1>
        <br></br>
        <!-- كارت تسجيل الدخول -->
        <div class="login-card">
            <h2 class="card-title">تسجيل الدخول</h2>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" class="bubble-input" placeholder="أدخل اسم المستخدم" required>
                </div>
                
                <br>

                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" class="bubble-input" placeholder="أدخل كلمة المرور" required>
                </div>

                <!-- رسالة الخطأ تنبيهية -->
                <div id="errorMessage" class="error-message">❌ اسم المستخدم أو كلمة المرور غير صحيحة!</div>

                <br>

                <button type="submit" class="login-btn">دخول</button>
            </form>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="footer">
        <div class="footer-container">
            <div><i class="fa-solid fa-phone" style="color: #a78bfa;"></i> التواصل: 01129713352 | 01005389471</div>
            <div><i class="fa-brands fa-facebook" style="color: #a78bfa;"></i> <a href="https://www.facebook.com/share/1BaiuDESTS/" target="_blank">صفحتنا على فيسبوك</a></div>
            <div><i class="fa-solid fa-code" style="color: #a78bfa;"></i> تصميم وتطوير: <span class="designer-name">ENG / AHMED ELSHEMEE MAHMOUD</span></div>
        </div>
    </footer>

    <script>
        // تحديد اسم المستخدم وكلمة المرور المعتمدة
        const CORRECT_USER = "marassi";
        const CORRECT_PASS = "1552004";

        function requireLogin(buttonName) {
            alert(`⚠️ يرجى تسجيل الدخول أولاً للوصول إلى قسم (${buttonName})!`);
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            // التحقق من صحة البيانات
            if (user === CORRECT_USER && pass === CORRECT_PASS) {
                errorDiv.style.display = "none";
                window.location.href = "dashboard.html"; // الانتقال للوحة التحكم
            } else {
                // إظهار تنبيه بخطأ البيانات
                errorDiv.style.display = "block";
            }
        }
    </script>
</body>
</html>
