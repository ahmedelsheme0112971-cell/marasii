<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سافر ترافيل - حسابات الشركة</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{min-height:100vh;background:#0f051d;color:#fff;overflow-x:hidden;position:relative}
.blur-circle-1,.blur-circle-2{position:fixed;border-radius:50%;filter:blur(160px);pointer-events:none;z-index:0}
.blur-circle-1{width:600px;height:600px;background:#5b21b6;top:0;left:0;opacity:.45}
.blur-circle-2{width:550px;height:550px;background:#7c3aed;bottom:0;right:0;opacity:.35}

.header-nav{
 position:relative;z-index:20;margin:25px auto 0;width:min(1250px,95%);
 padding:15px 25px;border-radius:55px;background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);
 display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap;
 overflow-x:auto;scrollbar-width:none
}
.header-nav::-webkit-scrollbar{display:none}
.nav-btn{
 flex:0 0 auto;border:1px solid rgba(255,255,255,.14);border-radius:50px;
 padding:11px 20px;background:rgba(255,255,255,.05);color:#fff;text-decoration:none;
 font-weight:800;font-size:.98rem;cursor:pointer;transition:.25s;white-space:nowrap
}
.nav-btn:hover{transform:translateY(-2px);background:rgba(124,58,237,.22);border-color:#a78bfa}

.session-top-bar{
 position:relative;z-index:20;width:min(1250px,95%);margin:12px auto;
 display:flex;justify-content:space-between;align-items:center;gap:12px
}
.session-user-wrap,.session-timer{
 min-height:48px;padding:7px 14px;border-radius:30px;background:rgba(255,255,255,.08);
 border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);display:inline-flex;
 align-items:center;gap:9px;font-weight:800;box-shadow:0 10px 25px rgba(0,0,0,.22)
}
.session-user-wrap{position:relative;cursor:pointer;user-select:none}
.session-user-circle{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.session-user-name{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-user-arrow{font-size:.7rem;color:#c4b5fd;transition:.2s}
.session-user-wrap.menu-open .session-user-arrow{transform:rotate(180deg)}
.session-timer i,.session-time-value{color:#86efac}
.session-time-value{direction:ltr;min-width:55px;text-align:center;font-weight:900}
.user-dropdown-menu{
 position:absolute;top:calc(100% + 12px);right:0;width:300px;padding:10px;border-radius:20px;
 background:rgba(24,10,43,.97);border:1px solid rgba(255,255,255,.18);
 box-shadow:0 25px 60px rgba(0,0,0,.5);opacity:0;visibility:hidden;
 transform:translateY(-8px) scale(.97);transition:.2s;z-index:100;pointer-events:none
}
.session-user-wrap.menu-open .user-dropdown-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.user-dropdown-title{padding:8px 10px 12px;color:#ddd6fe;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.user-dropdown-option{
 width:100%;border:1px solid rgba(74,222,128,.25);border-radius:15px;padding:11px;
 display:flex;align-items:center;gap:10px;background:rgba(34,197,94,.1);color:#fff;cursor:pointer;text-align:right
}
.user-dropdown-option:hover{background:rgba(34,197,94,.2)}
.user-dropdown-option-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(34,197,94,.16);color:#86efac}
.user-dropdown-option-text{flex:1;display:flex;flex-direction:column;gap:2px}
.user-dropdown-option-text strong{font-size:.88rem}
.user-dropdown-option-text small{font-size:.7rem;color:#a7f3d0}
.user-dropdown-option-arrow{color:#86efac}

.container{position:relative;z-index:5;width:min(1250px,95%);margin:25px auto 50px}
.title{text-align:center;font-size:2.2rem;margin:15px 0 25px}
.title i{color:#c084fc}

.card{
 background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);
 border-radius:28px;padding:25px;backdrop-filter:blur(18px);
 box-shadow:0 20px 60px rgba(0,0,0,.25)
}
.card-title{font-size:1.25rem;margin-bottom:20px;display:flex;align-items:center;gap:9px}
.card-title i{color:#c084fc}

.form-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:15px}
.field label{display:block;color:#ddd6fe;font-weight:800;margin-bottom:8px}
.input,.select{
 width:100%;padding:14px 15px;border-radius:16px;border:1px solid rgba(255,255,255,.15);
 background:rgba(0,0,0,.16);color:#fff;outline:none;font:700 15px 'Tajawal'
}
.input:focus,.select:focus{border-color:#a78bfa;box-shadow:0 0 18px rgba(167,139,250,.18)}
.select option{background:#21102f;color:#fff}
.notes{grid-column:span 2}
.form-actions{grid-column:span 2;display:flex;gap:10px}
.btn{
 flex:1;border:0;border-radius:17px;padding:14px;color:#fff;cursor:pointer;
 font:900 15px 'Tajawal';transition:.25s
}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.75;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.btn-transfer{background:linear-gradient(135deg,#0891b2,#164e63)}
.btn-excel{background:linear-gradient(135deg,#16a34a,#166534)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#7f1d1d)}

.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:20px}
.summary-card{
 padding:19px;border:1px solid rgba(255,255,255,.14);border-radius:22px;
 text-align:center;position:relative;overflow:hidden;transition:.25s;
 box-shadow:0 12px 30px rgba(0,0,0,.18)
}
.summary-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.summary-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin:auto;transition:.25s}
.summary-card small{display:block;color:#e2e8f0;margin-top:9px;font-weight:700}
.summary-card strong{display:block;font-size:1.3rem;margin-top:4px;font-weight:900}
.summary-card:nth-child(1){background:linear-gradient(145deg,rgba(34,197,94,.20),rgba(21,128,61,.08));border-color:rgba(74,222,128,.35)}
.summary-card:nth-child(1) .summary-icon{background:rgba(34,197,94,.18);color:#86efac}
.summary-card:nth-child(2){background:linear-gradient(145deg,rgba(239,68,68,.20),rgba(127,29,29,.08));border-color:rgba(248,113,113,.35)}
.summary-card:nth-child(2) .summary-icon{background:rgba(239,68,68,.18);color:#fca5a5}
.summary-card:nth-child(3){background:linear-gradient(145deg,rgba(124,58,237,.22),rgba(76,29,149,.08));border-color:rgba(167,139,250,.35)}
.summary-card:nth-child(3) .summary-icon{background:rgba(124,58,237,.20);color:#c4b5fd}
.summary-card:nth-child(4){background:linear-gradient(145deg,rgba(14,165,233,.20),rgba(3,105,161,.08));border-color:rgba(56,189,248,.35)}
.summary-card:nth-child(4) .summary-icon{background:rgba(14,165,233,.18);color:#7dd3fc}
.summary-card:nth-child(5){background:linear-gradient(145deg,rgba(245,158,11,.20),rgba(180,83,9,.08));border-color:rgba(251,191,36,.35)}
.summary-card:nth-child(5) .summary-icon{background:rgba(245,158,11,.18);color:#fcd34d}

.accounts{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:20px}
.account-card{
 padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:22px;
 position:relative;overflow:hidden;transition:.25s;box-shadow:0 14px 35px rgba(0,0,0,.20)
}
.account-card:hover{transform:translateY(-4px);box-shadow:0 20px 45px rgba(0,0,0,.30)}
.account-head{display:flex;align-items:center;gap:9px;font-weight:900}
.account-head i{transition:.25s}
.account-balance{font-size:1.5rem;font-weight:900;margin:14px 0}
.account-line{display:flex;justify-content:space-between;color:#e2e8f0;font-size:.84rem;margin:4px 0}
.account-card button{
 width:100%;margin-top:12px;padding:10px;border-radius:13px;border:1px solid rgba(255,255,255,.15);
 background:rgba(0,0,0,.15);color:#fff;font:800 13px 'Tajawal';cursor:pointer;transition:.25s
}
.account-card button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.cash-account{background:linear-gradient(145deg,rgba(74,222,128,.24),rgba(22,101,52,.10));border-color:rgba(134,239,172,.45)}
.cash-account .account-head i{color:#86efac}.cash-account .account-balance{color:#bbf7d0}
.misr-account{background:linear-gradient(145deg,rgba(127,29,29,.48),rgba(69,10,10,.22));border-color:rgba(248,113,113,.38)}
.misr-account .account-head i{color:#fca5a5}.misr-account .account-balance{color:#fecaca}
.alex-account{background:linear-gradient(145deg,rgba(249,115,22,.30),rgba(154,52,18,.12));border-color:rgba(251,146,60,.45)}
.alex-account .account-head i{color:#fdba74}.alex-account .account-balance{color:#fed7aa}
.kuwait-account{background:linear-gradient(145deg,rgba(34,197,94,.18),rgba(20,83,45,.10));border-color:rgba(74,222,128,.38)}
.kuwait-account .account-head i{color:#4ade80}.kuwait-account .account-balance{color:#bbf7d0}
.vodafone-account{background:linear-gradient(145deg,rgba(239,68,68,.28),rgba(127,29,29,.12));border-color:rgba(248,113,113,.45)}
.vodafone-account .account-head i{color:#f87171}.vodafone-account .account-balance{color:#fecaca}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.quick-btn{
 padding:18px;border:1px solid rgba(255,255,255,.12);border-radius:20px;
 background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font:900 14px 'Tajawal'
}
.quick-btn i{display:block;font-size:23px;color:#c4b5fd;margin-bottom:8px}
.quick-btn:hover{background:rgba(124,58,237,.15);transform:translateY(-2px)}

.modal{
 position:fixed;inset:0;background:rgba(5,2,12,.78);backdrop-filter:blur(9px);
 display:none;align-items:center;justify-content:center;padding:18px;z-index:999
}
.modal.active{display:flex}
.modal-box{
 width:min(1050px,100%);max-height:90vh;overflow:auto;background:#190a2d;
 border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:25px;box-shadow:0 30px 90px #000
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h2{font-size:1.3rem}
.close-btn{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.modal-filter{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:end}
.table-wrap{overflow:auto;margin-top:18px}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:11px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
th{color:#c4b5fd;background:rgba(124,58,237,.1)}
.empty{text-align:center;color:#94a3b8;padding:35px}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.report-box{padding:16px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.report-box small{color:#cbd5e1}.report-box strong{display:block;font-size:1.35rem;margin-top:5px}

.session-warning-overlay{
 position:fixed;inset:0;background:rgba(5,2,12,.82);backdrop-filter:blur(10px);
 display:none;align-items:center;justify-content:center;z-index:2000;padding:20px
}
.session-warning-overlay.active{display:flex}
.session-warning-modal{width:min(480px,100%);padding:30px;border-radius:28px;text-align:center;background:#1a0b2d;border:1px solid rgba(255,255,255,.18);box-shadow:0 30px 90px #000}
.session-warning-icon{font-size:42px;color:#facc15}.session-warning-title{font-size:1.4rem;font-weight:900;margin:10px 0}.session-warning-text{color:#cbd5e1;line-height:1.8}.session-warning-countdown{font-size:2rem;font-weight:900;color:#f87171;margin:15px}
.session-warning-actions{display:flex;gap:10px}.session-warning-actions button{flex:1;padding:12px;border:0;border-radius:14px;color:#fff;font:900 14px 'Tajawal';cursor:pointer}
.session-continue-btn{background:#16a34a}.session-logout-btn{background:#dc2626}

@media(max-width:1050px){
 .summary{grid-template-columns:repeat(3,1fr)}.accounts{grid-template-columns:repeat(2,1fr)}
 .form-grid{grid-template-columns:1fr 1fr}.notes,.form-actions{grid-column:span 2}.quick-actions{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
 .session-top-bar{flex-direction:column;align-items:stretch}.session-user-wrap,.session-timer{justify-content:center}
 .form-grid{grid-template-columns:1fr}.notes,.form-actions{grid-column:span 1}.form-actions{flex-direction:column}
 .summary{grid-template-columns:1fr 1fr}.accounts{grid-template-columns:1fr}.quick-actions{grid-template-columns:1fr}
 .modal-filter{grid-template-columns:1fr}.title{font-size:1.75rem}
}

/* ==============================
   ألوان أزرار الحسابات حسب الحساب
   ============================== */
.cash-account button{
  background:linear-gradient(135deg,#16a34a,#166534);
  border-color:rgba(134,239,172,.35);
}
.cash-account button:hover{background:linear-gradient(135deg,#22c55e,#15803d)}

.misr-account button{
  background:linear-gradient(135deg,#991b1b,#5f1010);
  border-color:rgba(252,165,165,.35);
}
.misr-account button:hover{background:linear-gradient(135deg,#b91c1c,#7f1d1d)}

.alex-account button{
  background:linear-gradient(135deg,#f97316,#c2410c);
  border-color:rgba(253,186,116,.40);
}
.alex-account button:hover{background:linear-gradient(135deg,#fb923c,#ea580c)}

.kuwait-account button{
  background:linear-gradient(135deg,#22c55e,#166534);
  border-color:rgba(134,239,172,.35);
}
.kuwait-account button:hover{background:linear-gradient(135deg,#4ade80,#15803d)}

.vodafone-account button{
  background:linear-gradient(135deg,#ef4444,#991b1b);
  border-color:rgba(252,165,165,.40);
}
.vodafone-account button:hover{background:linear-gradient(135deg,#f87171,#b91c1c)}

/* ==============================
   أزرار العمليات حسب الوظيفة
   ============================== */
.btn-primary{
  background:linear-gradient(135deg,#7c3aed,#4c1d95);
  box-shadow:0 8px 20px rgba(124,58,237,.22);
}
.btn-primary:hover{
  background:linear-gradient(135deg,#8b5cf6,#5b21b6);
  box-shadow:0 12px 25px rgba(124,58,237,.30);
}

.btn-transfer{
  background:linear-gradient(135deg,#0891b2,#155e75);
  box-shadow:0 8px 20px rgba(8,145,178,.20);
}
.btn-transfer:hover{
  background:linear-gradient(135deg,#06b6d4,#0e7490);
}

.btn-excel{
  background:linear-gradient(135deg,#16a34a,#166534);
  box-shadow:0 8px 20px rgba(22,163,74,.20);
}
.btn-excel:hover{
  background:linear-gradient(135deg,#22c55e,#15803d);
}

.btn-danger{
  background:linear-gradient(135deg,#dc2626,#7f1d1d);
  box-shadow:0 8px 20px rgba(220,38,38,.20);
}
.btn-danger:hover{
  background:linear-gradient(135deg,#ef4444,#991b1b);
}

/* ==============================
   أزرار الإجراءات السريعة
   ============================== */
.quick-btn{
  position:relative;
  overflow:hidden;
  transition:.25s;
}
.quick-btn:nth-child(1) i{color:#a78bfa}
.quick-btn:nth-child(2) i{color:#60a5fa}
.quick-btn:nth-child(3) i{color:#22d3ee}
.quick-btn:nth-child(4) i{color:#f59e0b}
.quick-btn:nth-child(5) i{color:#4ade80}

.quick-btn:nth-child(1):hover{
  background:rgba(124,58,237,.18);
  border-color:rgba(167,139,250,.35);
}
.quick-btn:nth-child(2):hover{
  background:rgba(59,130,246,.16);
  border-color:rgba(96,165,250,.35);
}
.quick-btn:nth-child(3):hover{
  background:rgba(6,182,212,.16);
  border-color:rgba(34,211,238,.35);
}
.quick-btn:nth-child(4):hover{
  background:rgba(245,158,11,.16);
  border-color:rgba(251,191,36,.35);
}
.quick-btn:nth-child(5):hover{
  background:rgba(34,197,94,.16);
  border-color:rgba(74,222,128,.35);
}

/* أزرار التنبيه */
.session-continue-btn{
  background:linear-gradient(135deg,#16a34a,#166534);
}
.session-logout-btn{
  background:linear-gradient(135deg,#dc2626,#7f1d1d);
}

/* زر إغلاق النوافذ */
.close-btn{
  transition:.25s;
}
.close-btn:hover{
  background:rgba(239,68,68,.18);
  color:#fca5a5;
  transform:rotate(4deg);
}


/* ==========================================
   ألوان أزرار الإجراءات السفلية الخمسة فقط
   ========================================== */
.quick-actions .quick-btn{
  transition:.25s;
  border:1px solid rgba(255,255,255,.16);
}

.quick-actions .quick-btn:nth-child(1){
  background:linear-gradient(135deg,#6d28d9,#4c1d95);
  border-color:rgba(196,181,253,.4);
}
.quick-actions .quick-btn:nth-child(1) i{color:#ddd6fe}
.quick-actions .quick-btn:nth-child(1):hover{
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  box-shadow:0 12px 28px rgba(124,58,237,.28);
}

.quick-actions .quick-btn:nth-child(2){
  background:linear-gradient(135deg,#2563eb,#1e3a8a);
  border-color:rgba(147,197,253,.4);
}
.quick-actions .quick-btn:nth-child(2) i{color:#bfdbfe}
.quick-actions .quick-btn:nth-child(2):hover{
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  box-shadow:0 12px 28px rgba(37,99,235,.28);
}

.quick-actions .quick-btn:nth-child(3){
  background:linear-gradient(135deg,#0891b2,#155e75);
  border-color:rgba(103,232,249,.4);
}
.quick-actions .quick-btn:nth-child(3) i{color:#a5f3fc}
.quick-actions .quick-btn:nth-child(3):hover{
  background:linear-gradient(135deg,#06b6d4,#0e7490);
  box-shadow:0 12px 28px rgba(8,145,178,.28);
}

.quick-actions .quick-btn:nth-child(4){
  background:linear-gradient(135deg,#d97706,#92400e);
  border-color:rgba(253,186,116,.4);
}
.quick-actions .quick-btn:nth-child(4) i{color:#fed7aa}
.quick-actions .quick-btn:nth-child(4):hover{
  background:linear-gradient(135deg,#f59e0b,#b45309);
  box-shadow:0 12px 28px rgba(217,119,6,.28);
}

.quick-actions .quick-btn:nth-child(5){
  background:linear-gradient(135deg,#16a34a,#166534);
  border-color:rgba(134,239,172,.4);
}
.quick-actions .quick-btn:nth-child(5) i{color:#bbf7d0}
.quick-actions .quick-btn:nth-child(5):hover{
  background:linear-gradient(135deg,#22c55e,#15803d);
  box-shadow:0 12px 28px rgba(22,163,74,.28);
}

</style>
</head>

<body>

<div class="blur-circle-1"></div>
<div class="blur-circle-2"></div>

<nav class="header-nav">
 <a href="dashboard.html" class="nav-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
 <a href="company_accounts.html" class="nav-btn"><i class="fa-solid fa-wallet"></i> الحسابات</a>
 <button class="nav-btn" onclick="openStatement()"><i class="fa-solid fa-file-invoice-dollar"></i> كشف حساب</button>
 <button class="nav-btn" onclick="openReports()"><i class="fa-solid fa-chart-column"></i> التقارير</button>
 <button class="nav-btn" onclick="openTransfer()"><i class="fa-solid fa-right-left"></i> تحويل</button>
 <button class="nav-btn" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
</nav>

<div class="session-top-bar">
 <div class="session-user-wrap" id="sessionUserMenuWrap" onclick="toggleUserMenu(event)" aria-expanded="false">
  <span class="session-user-circle"><i class="fa-solid fa-user"></i></span>
  <span id="sessionUserName" class="session-user-name">...</span>
  <i class="fa-solid fa-chevron-down session-user-arrow"></i>

  <div class="user-dropdown-menu" onclick="event.stopPropagation()">
   <div class="user-dropdown-title"><i class="fa-solid fa-user-shield"></i> خيارات الحساب</div>
   <button id="googleSheetDropdownOption" class="user-dropdown-option" onclick="openGoogleSheetFromMenu(event)" style="display:none">
    <span class="user-dropdown-option-icon"><i class="fa-solid fa-table-cells-large"></i></span>
    <span class="user-dropdown-option-text">
     <strong>الدخول إلى Google Sheets</strong>
     <small>فتح قاعدة البيانات الرئيسية</small>
    </span>
    <i class="fa-solid fa-arrow-up-right-from-square user-dropdown-option-arrow"></i>
   </button>
  </div>
 </div>

 <div id="sessionTimer" class="session-timer">
  <i class="fa-solid fa-clock"></i>
  <span>متبقي</span>
  <span id="sessionTimeValue" class="session-time-value">15:00</span>
 </div>
</div>

<div id="sessionWarningOverlay" class="session-warning-overlay">
 <div class="session-warning-modal">
  <div class="session-warning-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
  <div class="session-warning-title">تنبيه انتهاء الجلسة</div>
  <div class="session-warning-text">لم يتم اكتشاف أي نشاط لفترة طويلة.<br>سيتم تسجيل خروجك تلقائيًا خلال:</div>
  <div id="sessionWarningCountdown" class="session-warning-countdown">01:00</div>
  <div class="session-warning-actions">
   <button class="session-continue-btn" onclick="continueSession()"><i class="fa-solid fa-rotate-right"></i> استمرار العمل</button>
   <button class="session-logout-btn" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
  </div>
 </div>
</div>

 <div class="form-grid">
  <div class="field">
   <label>الحساب</label>
   <select id="accountName" class="select">
    <option value="">اختر الحساب</option>

    <option>بنك اسكندرية</option>
    <option>البنك الكويتي</option>

   </select>
  </div>

  <div class="field">
   <label>دخل</label>

  </div>

  </div>

  <div class="form-actions">
   <button id="saveMovementBtn" class="btn btn-primary" onclick="saveMovement()"><i class="fa-solid fa-floppy-disk"></i> تسجيل الحركة</button>
   <button class="btn btn-transfer" onclick="openTransfer()"><i class="fa-solid fa-right-left"></i> تحويل بين الحسابات</button>

 <button class="quick-btn" onclick="openEditMovement()"><i class="fa-solid fa-pen-to-square"></i> تعديل عملية</button>
 <button class="quick-btn" onclick="exportCurrentDashboard()"><i class="fa-solid fa-file-excel"></i> تصدير ملخص Excel</button>
</section>

</main>

<script>
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbz_gXvUwKQeqIAt32zhfKJ_x_myC3Tdig5dhCjC8VpKZwmQwQw2ctGPmjEpobkFSRKSxQ/exec";
const GOOGLE_SHEET_VIEW_URL="https://docs.google.com/spreadsheets/d/1CGmRQQWLDFm0d9t6Kkc7lUnysjPpE8RxuYf2VWw7gsg/edit?gid=0#gid=0";
const ACCOUNTS=["النقدي المتاح","بنك مصر","بنك اسكندرية","البنك الكويتي","فودافون كاش"];
let lastReport=null;
let lastDashboard=null;

const $=id=>document.getElementById(id);
const todayISO=()=>new Date().toISOString().slice(0,10);
const money=n=>Number(n||0).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2})+" ج.م";
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function checkLogin(){
 if(localStorage.getItem("loggedIn")!=="true"||!localStorage.getItem("currentUser")){
  location.href="index.html";return false;
 }
 return true;
}

function getCurrentUser(){return localStorage.getItem("currentUser")||"غير معروف"}

function logoutUser(){
 clearSessionTimers();
 ["loggedIn","currentUser","loginTime","sessionLastActivity"].forEach(k=>localStorage.removeItem(k));
 location.href="index.html";
}

function setupGoogleSheetAccess(){
 const option=$("googleSheetDropdownOption");
 if(!option)return;
 option.style.display=getCurrentUser().trim().toLowerCase()==="shimee"?"flex":"none";
}

function toggleUserMenu(e){
 if(e)e.stopPropagation();
 const wrap=$("sessionUserMenuWrap");
 const open=wrap.classList.toggle("menu-open");
 wrap.setAttribute("aria-expanded",open?"true":"false");
}
function closeUserMenu(){
 const wrap=$("sessionUserMenuWrap");
 if(wrap){wrap.classList.remove("menu-open");wrap.setAttribute("aria-expanded","false")}
}
function openGoogleSheetFromMenu(e){
 if(e)e.stopPropagation();
 if(getCurrentUser().trim().toLowerCase()!=="shimee")return;
 window.open(GOOGLE_SHEET_VIEW_URL,"_blank","noopener,noreferrer");
 closeUserMenu();
}
document.addEventListener("click",e=>{
 const wrap=$("sessionUserMenuWrap");
 if(wrap&&!wrap.contains(e.target))closeUserMenu();
});

let sessionIdleTimer=null,sessionWarningTimer=null,sessionWarningOpen=false;
const SESSION_IDLE_LIMIT=15*60*1000;
const SESSION_WARNING_TIME=60*1000;

function saveSessionActivity(t){localStorage.setItem("sessionLastActivity",String(t))}
function getSessionLastActivity(){
 const t=Number(localStorage.getItem("sessionLastActivity")||0);
 return Number.isFinite(t)&&t>0?t:Date.now();
}
function initSessionUser(){$("sessionUserName").textContent=getCurrentUser()}
function clearSessionTimers(){
 if(sessionIdleTimer)clearInterval(sessionIdleTimer);
 if(sessionWarningTimer)clearInterval(sessionWarningTimer);
 sessionIdleTimer=null;sessionWarningTimer=null;
}
function registerSessionActivity(){
 if(localStorage.getItem("loggedIn")!=="true")return;
 if(sessionWarningOpen)return;
 const now=Date.now(),last=getSessionLastActivity();
 if(now-last>1000)saveSessionActivity(now);
}
function updateSessionTimer(){
 const remain=Math.max(0,SESSION_IDLE_LIMIT-(Date.now()-getSessionLastActivity()));
 const sec=Math.ceil(remain/1000);
 $("sessionTimeValue").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
 if(remain<=SESSION_WARNING_TIME)$("sessionTimer").style.borderColor="rgba(250,204,21,.6)";
 else $("sessionTimer").style.borderColor="";
}
function openSessionWarning(){
 if(sessionWarningOpen)return;
 sessionWarningOpen=true;
 $("sessionWarningOverlay").classList.add("active");
 let seconds=60;
 $("sessionWarningCountdown").textContent="01:00";
 sessionWarningTimer=setInterval(()=>{
  seconds--;
  $("sessionWarningCountdown").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
  if(seconds<=0){clearInterval(sessionWarningTimer);sessionWarningTimer=null;logoutUser()}
 },1000);
}
function continueSession(){
 sessionWarningOpen=false;
 if(sessionWarningTimer)clearInterval(sessionWarningTimer);
 sessionWarningTimer=null;
 $("sessionWarningOverlay").classList.remove("active");
 saveSessionActivity(Date.now());
 updateSessionTimer();
}
function checkSessionTimeout(){
 if(localStorage.getItem("loggedIn")!=="true"){clearSessionTimers();return}
 const remain=SESSION_IDLE_LIMIT-(Date.now()-getSessionLastActivity());
 updateSessionTimer();
 if(remain<=0){logoutUser();return}
 if(remain<=SESSION_WARNING_TIME)openSessionWarning();
}
function startSessionManager(){
 if(localStorage.getItem("loggedIn")!=="true")return;
 initSessionUser();
 if(!localStorage.getItem("sessionLastActivity"))saveSessionActivity(Date.now());
 clearSessionTimers();
 checkSessionTimeout();
 sessionIdleTimer=setInterval(checkSessionTimeout,1000);
}
["click","keydown","mousedown","touchstart","scroll","input","change","submit","mousemove"].forEach(ev=>document.addEventListener(ev,registerSessionActivity,{passive:true}));
window.addEventListener("pageshow",()=>{if(localStorage.getItem("loggedIn")==="true"){initSessionUser();checkSessionTimeout()}});

function jsonp(action,params={}){
 return new Promise((resolve,reject)=>{
  const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*999999);
  let script=document.createElement("script");
  window[cb]=data=>{delete window[cb];script.remove();resolve(data)};
  const q=new URLSearchParams({action,callback:cb,...params});
  script.src=GOOGLE_SCRIPT_URL+"?"+q.toString();
  script.onerror=()=>{delete window[cb];script.remove();reject(new Error("connection"))};
  document.body.appendChild(script);
 });
}
async function post(data){
 await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
}

function fillOptions(){
 $("statementAccount").innerHTML='<option value="">كل الحسابات</option>'+ACCOUNTS.map(a=>`<option>${esc(a)}</option>`).join("");
 const opts='<option value="">اختر الحساب</option>'+ACCOUNTS.map(a=>`<option>${esc(a)}</option>`).join("");
 $("fromAccount").innerHTML=opts;$("toAccount").innerHTML=opts;
}

let editingAccountRow=0;

function openEditMovement(){
 $("editSearchDate").value="";
 $("editSearchAmount").value="";
 $("editSearchResult").innerHTML='<div class="empty">اكتب تاريخ العملية والمبلغ ثم اضغط بحث.</div>';
 $("editFormWrap").style.display="none";
 editingAccountRow=0;
 const opts='<option value="">اختر الحساب</option>'+ACCOUNTS.map(a=>`<option>${esc(a)}</option>`).join("");
 $("editAccountName").innerHTML=opts;
 openModal("editMovementModal");
}

async function searchEditMovement(){
 const date=$("editSearchDate").value;
 const amount=Number($("editSearchAmount").value||0);
 if(!date)return alert("⚠️ اختر تاريخ العملية.");
 if(amount<=0)return alert("⚠️ أدخل مبلغ العملية.");
 $("editSearchResult").innerHTML='<div class="empty">⏳ جاري البحث...</div>';
 $("editFormWrap").style.display="none";
 try{
  const r=await jsonp("findAccountTransactions",{date,amount});
  if(!r.success)throw new Error(r.message||"error");
  const rows=r.rows||[];
  if(!rows.length){
   $("editSearchResult").innerHTML='<div class="empty">❌ لم يتم العثور على عملية بنفس التاريخ والمبلغ.</div>';
   return;
  }
  $("editSearchResult").innerHTML=`
   <table style="min-width:900px">
    <thead><tr><th>التاريخ</th><th>الحساب</th><th>دخل</th><th>خرج</th><th>الملاحظات</th><th>الموظف</th><th>النوع</th><th>اختيار</th></tr></thead>
    <tbody>${rows.map(x=>`<tr>
     <td>${esc(x.date)}</td><td>${esc(x.accountName)}</td><td>${money(x.in)}</td><td>${money(x.out)}</td><td>${esc(x.notes)}</td><td>${esc(x.employeeName)}</td><td>${esc(x.type)}</td>
     <td><button class="btn btn-primary" style="padding:9px 14px" onclick="selectEditMovement(${Number(x.rowNumber)})"><i class="fa-solid fa-pen"></i> تعديل</button></td>
    </tr>`).join("")}</tbody>
   </table>`;
 }catch(e){
  $("editSearchResult").innerHTML='<div class="empty">❌ تعذر البحث عن العملية.</div>';
 }
}

async function selectEditMovement(rowNumber){
 try{
  const r=await jsonp("getAccountTransactionByRow",{rowNumber});
  if(!r.success||!r.row)throw new Error(r.message||"error");
  const x=r.row;
  if(String(x.type||"").indexOf("تحويل ")===0){
   alert("⚠️ هذه عملية تحويل بين حسابين، وللحفاظ على توازن الحسابات يتم تعديل التحويل من نافذة التحويل وليس من تعديل العملية العادية.");
   return;
  }
  editingAccountRow=Number(x.rowNumber);
  $("editAccountName").value=x.accountName||"";
  $("editAmountIn").value=Number(x.in||0)||"";
  $("editAmountOut").value=Number(x.out||0)||"";
  $("editMovementDate").value=x.date||"";
  $("editNotes").value=x.notes||"";
  $("editFormWrap").style.display="block";
  $("editFormWrap").scrollIntoView({behavior:"smooth",block:"nearest"});
 }catch(e){alert("❌ تعذر تحميل بيانات العملية.")}
}

async function saveEditedMovement(){
 if(!editingAccountRow)return alert("⚠️ اختر العملية المراد تعديلها أولاً.");
 const account=$("editAccountName").value;
 const amountIn=Number($("editAmountIn").value||0);
 const amountOut=Number($("editAmountOut").value||0);
 const date=$("editMovementDate").value;
 const notes=$("editNotes").value.trim()||"لا يوجد";
 const btn=$("saveEditMovementBtn");
 const original=btn.innerHTML;
 if(!account)return alert("⚠️ اختر الحساب.");
 if(!date)return alert("⚠️ اختر التاريخ.");
 if(amountIn<=0&&amountOut<=0)return alert("⚠️ أدخل مبلغ الدخل أو الخروج.");
 if(amountIn>0&&amountOut>0)return alert("⚠️ لا يمكن تسجيل دخل وخروج في نفس الحركة.");
 try{
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري تعديل العملية...';
  await post({action:"updateAccountTransaction",rowNumber:editingAccountRow,date,accountName:account,amountIn,amountOut,notes,employeeName:getCurrentUser()});
  btn.innerHTML='<i class="fa-solid fa-circle-check"></i> تم تعديل العملية بنجاح';
  await loadDashboard();
  setTimeout(()=>{
   btn.innerHTML=original;btn.disabled=false;
   editingAccountRow=0;
   $("editFormWrap").style.display="none";
   $("editSearchResult").innerHTML='<div class="empty">تم التعديل بنجاح. يمكنك البحث عن عملية أخرى.</div>';
   $("editSearchDate").value="";$("editSearchAmount").value="";
  },1500);
 }catch(e){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> تعذر التعديل';
  setTimeout(()=>{btn.innerHTML=original;btn.disabled=false},1800);
 }
}

function cancelEditMovement(){
 editingAccountRow=0;
 $("editFormWrap").style.display="none";
}

async function saveMovement(){
 const btn=$("saveMovementBtn");
 const originalText=btn.innerHTML;

 const account=$("accountName").value;
 const amountIn=Number($("amountIn").value||0);
 const amountOut=Number($("amountOut").value||0);
 const date=$("movementDate").value;
 const notes=$("notes").value.trim()||"لا يوجد";

 if(!account){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> اختر الحساب';
  setTimeout(()=>btn.innerHTML=originalText,1800);
  return;
 }

 if(!date){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> اختر التاريخ';
  setTimeout(()=>btn.innerHTML=originalText,1800);
  return;
 }

 if(amountIn<=0&&amountOut<=0){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> أدخل المبلغ';
  setTimeout(()=>btn.innerHTML=originalText,1800);
  return;
 }

 if(amountIn>0&&amountOut>0){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> اختر دخل أو خرج';
  setTimeout(()=>btn.innerHTML=originalText,1800);
  return;
 }

 try{
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

  await post({
   action:"accountTransaction",
   date,
   accountName:account,
   amountIn,
   amountOut,
   notes,
   employeeName:getCurrentUser()
  });

  btn.innerHTML='<i class="fa-solid fa-circle-check"></i> تم الحفظ بنجاح';

  $("accountName").value="";
  $("amountIn").value="";
  $("amountOut").value="";
  $("notes").value="";
  $("movementDate").value="";

  await loadDashboard();

  setTimeout(()=>{
   btn.innerHTML=originalText;
   btn.disabled=false;
  },1800);

 }catch(e){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> تعذر الحفظ';

  setTimeout(()=>{
   btn.innerHTML=originalText;
   btn.disabled=false;
  },2000);
 }
}

async function loadDashboard(){
 try{
  const r=await jsonp("getAccountDashboard");
  if(!r.success)throw new Error(r.message||"error");
  lastDashboard=r;

  $("summary").innerHTML=`
   <div class="summary-card"><div class="summary-icon"><i class="fa-solid fa-arrow-down"></i></div><small>إجمالي الداخل</small><strong>${money(r.totalIn)}</strong></div>
   <div class="summary-card"><div class="summary-icon"><i class="fa-solid fa-arrow-up"></i></div><small>إجمالي الخارج</small><strong>${money(r.totalOut)}</strong></div>
   <div class="summary-card"><div class="summary-icon"><i class="fa-solid fa-scale-balanced"></i></div><small>صافي الحركة</small><strong>${money(r.net)}</strong></div>
   <div class="summary-card"><div class="summary-icon"><i class="fa-solid fa-wallet"></i></div><small>إجمالي الأرصدة</small><strong>${money(r.totalBalance)}</strong></div>
   <div class="summary-card"><div class="summary-icon"><i class="fa-solid fa-list-ol"></i></div><small>عدد الحركات</small><strong>${Number(r.transactions||0)}</strong></div>`;

  $("accounts").innerHTML=(r.accounts||[]).map(a=>{
   const accountClass={
    "النقدي المتاح":"cash-account",
    "بنك مصر":"misr-account",
    "بنك اسكندرية":"alex-account",
    "البنك الكويتي":"kuwait-account",
    "فودافون كاش":"vodafone-account"
   }[a.name]||"";

   return `
   <div class="account-card ${accountClass}">
    <div class="account-head"><i class="fa-solid fa-building-columns"></i>${esc(a.name)}</div>
    <div class="account-balance">${money(a.balance)}</div>
    <div class="account-line"><span>إجمالي الداخل</span><span>${money(a.in)}</span></div>
    <div class="account-line"><span>إجمالي الخارج</span><span>${money(a.out)}</span></div>
    <button onclick="openStatement('${esc(a.name)}')">كشف الحساب <i class="fa-solid fa-chevron-left"></i></button>
   </div>`;
  }).join("");
 }catch(e){
  $("summary").innerHTML='<div class="summary-card" style="grid-column:1/-1">❌ تعذر تحميل الحسابات. تأكد من نشر Google Apps Script بالإصدار الجديد.</div>';
  $("accounts").innerHTML="";
 }
}

function openModal(id){$(id).classList.add("active")}
function closeModal(id){$(id).classList.remove("active")}

function openStatement(account=""){
 fillOptions();
 $("statementAccount").value=account;
 $("statementFrom").value="";
 $("statementTo").value="";
 $("statementResult").innerHTML="";
 openModal("statementModal");
}

async function loadStatement(){
 try{
  const r=await jsonp("getAccountStatement",{
   accountName:$("statementAccount").value,
   fromDate:$("statementFrom").value,
   toDate:$("statementTo").value
  });
  const rows=r.rows||[];
  if(!rows.length){$("statementResult").innerHTML='<div class="empty">لا توجد حركات في الفترة المحددة.</div>';return}
  $("statementResult").innerHTML=`
   <table>
    <thead><tr><th>التاريخ</th><th>الحساب</th><th>دخل</th><th>خرج</th><th>الصافي</th><th>الملاحظات</th><th>الموظف</th><th>النوع</th></tr></thead>
    <tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.accountName)}</td><td>${money(x.in)}</td><td>${money(x.out)}</td><td>${money(x.net)}</td><td>${esc(x.notes)}</td><td>${esc(x.employeeName)}</td><td>${esc(x.type)}</td></tr>`).join("")}</tbody>
   </table>`;
 }catch(e){$("statementResult").innerHTML='<div class="empty">❌ تعذر تحميل كشف الحساب.</div>'}
}

function openTransfer(){
 fillOptions();
 $("transferDate").value=todayISO();
 $("transferAmount").value="";
 $("transferNotes").value="";
 $("fromAccount").value="";
 $("toAccount").value="";
 openModal("transferModal");
}

async function saveTransfer(){
 const btn=$("saveTransferBtn");
 const original=btn.innerHTML;

 const from=$("fromAccount").value;
 const to=$("toAccount").value;
 const amount=Number($("transferAmount").value||0);
 const date=$("transferDate").value;
 const notes=$("transferNotes").value.trim()||"تحويل بين الحسابات";

 if(!from||!to){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> اختر الحسابين';
  setTimeout(()=>btn.innerHTML=original,1800);
  return;
 }
 if(from===to){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> الحسابان متشابهان';
  setTimeout(()=>btn.innerHTML=original,1800);
  return;
 }
 if(amount<=0){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> أدخل المبلغ';
  setTimeout(()=>btn.innerHTML=original,1800);
  return;
 }
 if(!date){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> اختر التاريخ';
  setTimeout(()=>btn.innerHTML=original,1800);
  return;
 }

 try{
  btn.disabled=true;
  btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري تنفيذ التحويل...';

  await post({
   action:"accountTransfer",
   fromAccount:from,
   toAccount:to,
   amount,
   date,
   notes,
   employeeName:getCurrentUser()
  });

  btn.innerHTML='<i class="fa-solid fa-circle-check"></i> تم التحويل بنجاح';

  $("fromAccount").value="";
  $("toAccount").value="";
  $("transferAmount").value="";
  $("transferNotes").value="";
  $("transferDate").value="";

  await loadDashboard();

  setTimeout(()=>{
   closeModal("transferModal");
   btn.innerHTML=original;
   btn.disabled=false;
  },1500);

 }catch(e){
  btn.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> تعذر تنفيذ التحويل';
  setTimeout(()=>{
   btn.innerHTML=original;
   btn.disabled=false;
  },2000);
 }
}

function openReports(){
 const d=new Date(),first=new Date(d.getFullYear(),d.getMonth(),1);
 $("reportFrom").value=first.toISOString().slice(0,10);
 $("reportTo").value=todayISO();
 $("reportResult").innerHTML="";
 openModal("reportsModal");
}

  const r=await jsonp("getFinancialReport",{fromDate:$("reportFrom").value,toDate:$("reportTo").value});

  $("reportResult").innerHTML=`
   <div class="report-grid">
    <div class="report-box"><small>عدد الحجوزات</small><strong>${r.bookingCount||0}</strong></div>
    <div class="report-box"><small>قيمة الحجوزات</small><strong>${money(r.bookingTotal)}</strong></div>
    <div class="report-box"><small>المدفوع</small><strong>${money(r.bookingPaid)}</strong></div>
    <div class="report-box"><small>المتبقي</small><strong>${money(r.bookingRemaining)}</strong></div>
    <div class="report-box"><small>إجمالي الداخل</small><strong>${money(r.totalIn)}</strong></div>
    <div class="report-box"><small>إجمالي الخارج</small><strong>${money(r.totalOut)}</strong></div>
    <div class="report-box"><small>صافي الحركة</small><strong>${money(r.net)}</strong></div>
    <div class="report-box"><small>عدد الحركات المالية</small><strong>${r.transactionCount||0}</strong></div>
    <div class="report-box"><small>صافي الشركة</small><strong>${money(r.companyNet)}</strong></div>
   </div>
   <div class="table-wrap">
    <table><thead><tr><th>الموظف</th><th>عدد العمليات</th><th>الداخل</th><th>الخارج</th></tr></thead>
    <tbody>${(r.employees||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${money(x.in)}</td><td>${money(x.out)}</td></tr>`).join("")}</tbody></table>
   </div>`;
 }catch(e){$("reportResult").innerHTML='<div class="empty">❌ تعذر تحميل التقرير.</div>'}
}

function exportReportExcel(){
 if(!lastReport)return alert("⚠️ اعرض التقرير أولاً.");
 const data=[
  ["تقرير سافر ترافيل",""],
  ["من",lastReport.fromDate],["إلى",lastReport.toDate],
  ["عدد الحجوزات",lastReport.bookingCount||0],
  ["قيمة الحجوزات",lastReport.bookingTotal||0],
  ["المدفوع",lastReport.bookingPaid||0],
  ["المتبقي",lastReport.bookingRemaining||0],
  ["إجمالي الداخل",lastReport.totalIn||0],
  ["إجمالي الخارج",lastReport.totalOut||0],
  ["صافي الحركة",lastReport.net||0],
  ["عدد الحركات",lastReport.transactionCount||0],
  ["صافي الشركة",lastReport.companyNet||0]
 ];
 const ws=XLSX.utils.aoa_to_sheet(data);ws["!dir"]="rtl";
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"التقرير");
 XLSX.writeFile(wb,`تقرير_سافر_ترافيل_${lastReport.fromDate}_${lastReport.toDate}.xlsx`);
}

function exportCurrentDashboard(){
 if(!lastDashboard)return alert("⚠️ انتظر تحميل الحسابات.");
 const data=(lastDashboard.accounts||[]).map(a=>({
  "الحساب":a.name,"الرصيد":a.balance,"إجمالي الداخل":a.in,"إجمالي الخارج":a.out
 }));
 const ws=XLSX.utils.json_to_sheet(data);ws["!dir"]="rtl";
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"أرصدة الحسابات");
 XLSX.writeFile(wb,"ملخص_حسابات_سافر_ترافيل.xlsx");
}
