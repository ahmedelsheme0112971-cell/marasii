<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>اختبار فلتر الشركات</title>
</head>

<body>
    <button onclick="test()">تشغيل الاختبار</button>
    <pre id="out"></pre>
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_gXvUwKQeqIAt32zhfKJ_x_myC3Tdig5dhCjC8VpKZwmQwQw2ctGPmjEpobkFSRKSxQ/exec";
        const COMPANY_FILTER_LETTERS = ["ا", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "ه", "و", "ي"];

        function fetchCompanyLetter(letter) {
            return new Promise((resolve, reject) => {
                const cb = "compCB_" + Date.now() + "_" + Math.floor(Math.random() * 999999);
                let script = document.createElement("script");
                window[cb] = data => { delete window[cb]; script.remove(); resolve(data) };
                script.onerror = () => { delete window[cb]; script.remove(); reject(new Error("connection")) };
                const q = new URLSearchParams({ action: "search", section: "flight", query: letter, callback: cb });
                script.src = GOOGLE_SCRIPT_URL + "?" + q.toString() + "&_=" + Date.now();
                document.body.appendChild(script);
            });
        }

        async function loadAllCompanyRows() {
            const map = {};
            for (const L of COMPANY_FILTER_LETTERS) {
                try {
                    const r = await fetchCompanyLetter(L);
                    if (r && r.success) {
                        (r.results || []).forEach(x => {
                            if (x.rowNumber && !map[x.rowNumber]) map[x.rowNumber] = x;
                        });
                    }
                } catch (e) { }
            }
            return Object.values(map);
        }

        async function test() {
            const out = document.getElementById("out");
            out.textContent = "جاري...";
            const rows = await loadAllCompanyRows();
            const companies = {};
            rows.forEach(x => {
                const c = (x.companyName || "").trim();
                if (c && c !== "لا يوجد") companies[c] = (companies[c] || 0) + 1;
            });
            let html = "إجمالي التذاكر الفريدة: " + rows.length + "\n\nالشركات:\n";
            Object.keys(companies).sort().forEach(c => {
                html += c + " : " + companies[c] + " تذكرة\n";
            });
            // اختبار فلترة كلمة "اورانج"
            const orange = rows.filter(x => String(x.companyName || "").toLowerCase().includes("اورانج"));
            html += "\nفلترة 'اورانج': " + orange.length + " نتيجة\n";
            orange.forEach(x => { html += " - " + x.passengerName + " | " + x.companyName + " | متبقي=" + x.remainingAmount + "\n" });
            out.textContent = html;
        }
    </script>
</body>

</html>
